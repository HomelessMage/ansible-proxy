# Шаблон настроек одной ноды.
#
#   mkdir -p host_vars
#   cp host_vars.example.yml host_vars/<домен>.yml
#
# Имя файла = имя хоста из inventory.yml (обычно домен ноды). Значения по умолчанию лежат в
# group_vars/all.yml; здесь раскомментируй только то, что у этой ноды должно отличаться.
# Списки (xui_clients, ssh_allow, ssh_keys, zsh_plugins) не дополняют общие, а заменяют их целиком.
# host_vars/ в .gitignore — файл останется только у тебя.

# --- Клиенты VPN -------------------------------------------------------------
# Каждое имя — отдельный клиент со своим UUID и своей ссылкой в credentials/<домен>/links.txt.
# Имя — только метка (комментарий в панели), в ссылке и в панели клиент получает случайное имя.
# Добавил строку и запустил `ansible-playbook site.yml -l <домен> --tags xui` — клиент появился.
# Убрал строку — клиент НЕ удаляется: удалять или отключать в панели.
# xui_clients:
#   - home-router
#   - phone
#   - friend-router

# --- SSH ---------------------------------------------------------------------
# С каких адресов пускать на 22-й порт. Пусто — всем (вход всё равно только по ключу).
# Осторожно: если твой адрес меняется, можно запереть себя снаружи (останется только
# консоль хостера).
# ssh_allow:
#   - 203.0.113.10/32
#   - 198.51.100.0/24

# Публичные ключи root. Замена общего списка: свой ключ тоже должен быть здесь.
# ssh_keys:
#   - "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
#   - "ssh-ed25519 AAAA... второй-компьютер"

# Подключаться не по домену, а по IP (например, пока A-запись ещё не обновилась).
# Сертификат и ссылки всё равно выпускаются на домен.
# ansible_host: 203.0.113.10

# --- Домен -------------------------------------------------------------------
# Домен ноды, если он не совпадает с именем хоста в inventory.yml.
# node_domain: vpn.example.org

# --- Оболочка root -----------------------------------------------------------
# zsh_theme: darkblood
# zsh_plugins: [git]

# --- 3x-ui -------------------------------------------------------------------
# Версия панели. Обновление: поменять тег и запустить с --tags xui.
# xui_image: ghcr.io/mhsanaei/3x-ui:v3.11.0

# Порты на 127.0.0.1 сервера (наружу не открыты). Меняй только на новой ноде:
# - xui_panel_port — на нём же SSH-туннель к панели;
# - xhttp_port — на уже настроенной ноде смена порта создаст в панели ВТОРОЙ инбаунд
#   (xhttp-<порт>) с новыми клиентами, старый останется висеть.
# xui_panel_port: 5223
# xui_sub_port: 2096
# xhttp_port: 10001

# --- Страница-заглушка -------------------------------------------------------
# Каталог с файлами сайта ноды (по умолчанию site/<домен>/; нет каталога — страница nginx).
# site_dir: "{{ playbook_dir }}/site/other-name"
