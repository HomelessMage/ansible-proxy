- name: Hostname
  ansible.builtin.hostname:
    name: "{{ node_domain }}"

# Образы хостеров клонируют с шаблона: в настройке grub-pc остаётся диск шаблона
# (/dev/disk/by-id/…другой-id), и любой apt, задевший grub-pc, падает на «cannot grub-install».
# Прописываем настоящий загрузочный диск и донастраиваем недонастроенные пакеты.
- name: GRUB — диск загрузчика из шаблона хостера
  ansible.builtin.shell: |
    set -eu
    st=$(dpkg-query -W -f='${db:Status-Status}' grub-pc 2>/dev/null || true)
    case "$st" in ''|not-installed|config-files) echo ok; exit 0 ;; esac
    changed=0
    cur=$(debconf-show grub-pc | sed -n 's/^\* grub-pc\/install_devices: //p')
    good=0
    for d in $(echo "$cur" | tr ',' ' '); do [ -e "$d" ] && good=1; done
    if [ "$good" = 0 ]; then
      disk=$(grub-probe -t disk /boot/grub)
      dev=$disk
      for l in /dev/disk/by-id/*; do
        case $l in *-part*) continue ;; esac
        [ "$(readlink -f "$l")" = "$disk" ] && { dev=$l; break; }
      done
      echo "grub-pc grub-pc/install_devices multiselect $dev" | debconf-set-selections
      changed=1
    fi
    if [ -n "$(dpkg --audit)" ]; then
      DEBIAN_FRONTEND=noninteractive dpkg --configure -a
      changed=1
    fi
    [ "$changed" = 1 ] && echo changed || echo ok
  args: {executable: /bin/bash}
  register: grub_fix
  changed_when: grub_fix.stdout_lines | last == 'changed'

- name: Пакеты
  ansible.builtin.apt:
    name: [zsh, git, wget, curl, nano, nftables, unattended-upgrades, nginx, certbot, docker.io, docker-compose]
    update_cache: true
    cache_valid_time: 3600

- name: Автообновления безопасности
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: sshd — только ключи, root без пароля
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-node.conf
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    mode: "0644"
  notify: reload ssh

- name: sshd — проверка конфига
  ansible.builtin.command: sshd -t
  changed_when: false

- name: nftables — наружу только 22, 80, 443
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: nft -c -f %s
  notify: reload nftables

- name: nftables включён
  ansible.builtin.service: {name: nftables, enabled: true, state: started}

- name: Docker без собственного файрвола и bridge (контейнер в host-сети)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ {'iptables': false, 'ip6tables': false, 'bridge': 'none', 'log-driver': 'local'} | to_nice_json }}\n"
    mode: "0644"
  notify: restart docker

- name: Применить файрвол и docker до запуска сервисов
  ansible.builtin.meta: flush_handlers
