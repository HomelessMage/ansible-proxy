- name: root на zsh
  ansible.builtin.user:
    name: root
    shell: /usr/bin/zsh

- name: root — ~/.ssh
  ansible.builtin.file: {path: /root/.ssh, state: directory, mode: "0700"}

- name: root — ключи
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    line: "{{ item }}"
    create: true
    mode: "0600"
  loop: "{{ ssh_keys }}"

# То же, что делает установщик oh-my-zsh, но без curl | sh
- name: oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: /root/.oh-my-zsh
    depth: 1
    update: false

- name: .zshrc из шаблона (если его ещё нет)
  ansible.builtin.copy:
    src: /root/.oh-my-zsh/templates/zshrc.zsh-template
    dest: /root/.zshrc
    remote_src: true
    force: false
    mode: "0644"

- name: Тема и плагины
  ansible.builtin.lineinfile:
    path: /root/.zshrc
    regexp: "{{ item.re }}"
    line: "{{ item.line }}"
  loop:
    - {re: '^ZSH_THEME=', line: 'ZSH_THEME="{{ zsh_theme }}"'}
    - {re: '^plugins=', line: 'plugins=({{ zsh_plugins | join(" ") }})'}
